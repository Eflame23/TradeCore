spring:
  application:
    name: tradecore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradecore}
    username: ${DB_USER:tradecore_user}
    password: ${DB_PASSWORD:dev_secret_password_unsuitable_for_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.tradecore: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
